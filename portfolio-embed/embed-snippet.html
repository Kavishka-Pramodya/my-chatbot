<!-- ==========================================================================
     PORTFOLIO CHATBOT FLOATING WIDGET (Copy & Paste into your Portfolio)
     Add this snippet right before the closing </body> tag in your portfolio HTML
     ========================================================================== -->

<!-- 1. Floating Toggle Button -->
<div id="ai-chat-widget-root">
    <button id="ai-chat-toggle-btn" aria-label="Open AI Assistant" title="Chat with AI Assistant">
        <!-- Chat Bubble Icon -->
        <svg id="ai-chat-icon-open" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <!-- Close (X) Icon -->
        <svg id="ai-chat-icon-close" style="display: none;" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>

    <!-- 2. Chatbot Popup Window (Points to your deployed Vercel URL) -->
    <div id="ai-chat-modal" class="ai-chat-modal-hidden">
        <!-- REPLACE 'https://your-chatbot.vercel.app' WITH YOUR ACTUAL DEPLOYED VERCEL URL -->
        <iframe 
            id="ai-chat-iframe" 
            src="https://your-chatbot.vercel.app" 
            title="AI Chatbot Assistant"
            allow="clipboard-write"
            loading="lazy">
        </iframe>
    </div>
</div>

<!-- 3. Widget Styles -->
<style>
#ai-chat-widget-root {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 999999;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

#ai-chat-toggle-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #9333ea 100%);
    color: #ffffff;
    border: none;
    box-shadow: 0 8px 24px rgba(79, 70, 229, 0.45);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
}

#ai-chat-toggle-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 12px 30px rgba(79, 70, 229, 0.6);
}

#ai-chat-toggle-btn:active {
    transform: scale(0.95);
}

#ai-chat-modal {
    position: absolute;
    bottom: 75px;
    right: 0;
    width: 420px;
    height: 620px;
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 120px);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    transform-origin: bottom right;
}

#ai-chat-modal.ai-chat-modal-hidden {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.85) translateY(20px);
    visibility: hidden;
}

#ai-chat-iframe {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 20px;
    background: transparent;
}

@media (max-width: 480px) {
    #ai-chat-modal {
        position: fixed;
        bottom: 0;
        right: 0;
        width: 100vw;
        height: 100vh;
        max-width: 100vw;
        max-height: 100vh;
        border-radius: 0;
    }
}
</style>

<!-- 4. Toggle Interaction Script -->
<script>
(function() {
    const toggleBtn = document.getElementById("ai-chat-toggle-btn");
    const chatModal = document.getElementById("ai-chat-modal");
    const iconOpen = document.getElementById("ai-chat-icon-open");
    const iconClose = document.getElementById("ai-chat-icon-close");

    let isOpen = false;

    toggleBtn.addEventListener("click", function() {
        isOpen = !isOpen;
        if (isOpen) {
            chatModal.classList.remove("ai-chat-modal-hidden");
            iconOpen.style.display = "none";
            iconClose.style.display = "block";
        } else {
            chatModal.classList.add("ai-chat-modal-hidden");
            iconOpen.style.display = "block";
            iconClose.style.display = "none";
        }
    });
})();
</script>
