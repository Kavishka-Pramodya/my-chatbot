<style>
/* ==========================================================================
   Chatbot Widget - Theme-Adaptive Glassmorphism CSS System
   ========================================================================== */
#ai-chat-widget-root {
    position: fixed;
    bottom: 26px;
    right: 26px;
    z-index: 999999;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
}

/* 1. Floating Launcher Button (Dark Mode Default) */
#ai-chat-toggle-btn {
    position: relative;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 50%, #6366f1 100%);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 10px 30px -4px rgba(14, 165, 233, 0.55),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.45);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.28s cubic-bezier(0.16, 1, 0.3, 1),
                background 0.4s ease,
                border-color 0.4s ease;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    outline: none;
}

#ai-chat-toggle-btn:hover {
    transform: scale(1.08) translateY(-2px);
    box-shadow: 0 16px 36px -4px rgba(56, 189, 248, 0.7),
                inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.6);
}

#ai-chat-toggle-btn:active {
    transform: scale(0.96) translateY(0);
}

/* Light Mode Overrides for Toggle Button */
html.light #ai-chat-toggle-btn {
    background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 60%, #38bdf8 100%);
    border: 1px solid rgba(255, 255, 255, 0.75);
    box-shadow: 0 10px 26px -3px rgba(2, 132, 199, 0.42),
                inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.95);
}

html.light #ai-chat-toggle-btn:hover {
    box-shadow: 0 16px 34px -3px rgba(2, 132, 199, 0.55),
                inset 0 1.5px 1px 0 #ffffff;
}

/* Pulsing ambient aura ring */
.ai-chat-pulse-glow {
    position: absolute;
    top: -4px;
    left: -4px;
    right: -4px;
    bottom: -4px;
    border-radius: 50%;
    background: transparent;
    border: 2px solid rgba(56, 189, 248, 0.5);
    animation: ai-pulse 2.6s infinite cubic-bezier(0.24, 0, 0.38, 1);
    pointer-events: none;
    z-index: -1;
}

html.light .ai-chat-pulse-glow {
    border-color: rgba(14, 165, 233, 0.45);
}

@keyframes ai-pulse {
    0% {
        transform: scale(0.95);
        opacity: 0.8;
    }
    70% {
        transform: scale(1.35);
        opacity: 0;
    }
    100% {
        transform: scale(1.35);
        opacity: 0;
    }
}

/* Online Indicator Dot on Button */
.ai-chat-online-dot {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 13px;
    height: 13px;
    background-color: #10b981;

    box-shadow: 0 0 8px rgba(16, 185, 129, 0.8);

}

}

.ai-chat-online-ping {
    position: absolute;
    top: -1px;
    left: -1px;
    width: 100%;
    height: 100%;

    background-color: #10b981;
    opacity: 0.75;
    animation: ai-ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;

    75%, 100% {
        transform: scale(2.2);
        opacity: 0;
    }
}

.ai-chat-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.25s ease;
}

/* 2. Floating Chat Modal Window */
#ai-chat-modal {
    position: fixed;
    bottom: 100px;
    right: 26px;
    width: 420px;
    height: 620px;
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 120px);
    border-radius: 22px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    
    /* Dark Mode Glass */
    background: rgba(10, 16, 32, 0.88);
    backdrop-filter: blur(28px) saturate(200%);
    -webkit-backdrop-filter: blur(28px) saturate(200%);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 24px 60px -10px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.08),
                0 0 35px rgba(56, 189, 248, 0.12);

    transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                visibility 0.3s,
                background 0.4s ease,
                border-color 0.4s ease,
                box-shadow 0.4s ease;
    transform-origin: bottom right;
    z-index: 999998;
}

/* Hidden Modal State */
#ai-chat-modal.ai-chat-modal-hidden {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.9) translateY(20px);

/* Light Mode Overrides for Chat Modal */
html.light #ai-chat-modal {
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 24px 60px -10px rgba(15, 23, 42, 0.16),
                0 4px 16px -2px rgba(15, 23, 42, 0.05),

<script>
// ==========================================================================
// Floating AI Chatbot Controller & Dynamic Portfolio Theme Synchronizer
// ==========================================================================
(function() {
    const toggleBtn = document.getElementById("ai-chat-toggle-btn");
    const closeBtn = document.getElementById("ai-chat-close-btn");
    const reloadBtn = document.getElementById("ai-chat-reload-btn");
    const chatModal = document.getElementById("ai-chat-modal");
    const iconOpen = document.getElementById("ai-chat-icon-open");
    const iconClose = document.getElementById("ai-chat-icon-close");
    const chatIframe = document.getElementById("ai-chat-iframe");
    const chatLoader = document.getElementById("ai-chat-loader");
    const themeIcon = document.getElementById("ai-chat-theme-icon");
    const themeName = document.getElementById("ai-chat-theme-name");
    
    let isOpen = false;

    // Helper: Determine currently active theme on portfolio
    function getActivePortfolioTheme() {
        return document.documentElement.classList.contains("light") ? "light" : "dark";
    }

    // Synchronize theme to widget UI and postMessage to chatbot iframe
    function syncChatbotTheme(theme) {
        if (!theme) theme = getActivePortfolioTheme();
        const isLight = theme === "light";

        // Update Theme Badge in Modal Header
        if (themeIcon) themeIcon.textContent = isLight ? "light_mode" : "dark_mode";
        if (themeName) themeName.textContent = isLight ? "Light" : "Dark";

        // Send message to IFrame for real-time inside theme toggle
        if (chatIframe && chatIframe.contentWindow) {
            try {
                chatIframe.contentWindow.postMessage({
                    type: "THEME_CHANGE",
                    theme: theme
                }, "*");
            } catch (e) {
                // Ignore cross-origin issues
            }
        }
    }

    // Toggle Modal Open / Closed
    function setModalVisibility(open) {
        isOpen = open;
        if (isOpen) {
            chatModal.classList.remove("ai-chat-modal-hidden");
            iconOpen.style.display = "none";
            iconClose.style.display = "inline-flex";
            toggleBtn.setAttribute("aria-expanded", "true");
            toggleBtn.setAttribute("title", "Close AI Assistant");
            syncChatbotTheme();
        } else {
            chatModal.classList.add("ai-chat-modal-hidden");
            iconOpen.style.display = "inline-flex";
            iconClose.style.display = "none";
            toggleBtn.setAttribute("aria-expanded", "false");
            toggleBtn.setAttribute("title", "Chat with AI Assistant");
        }
    }

    if (toggleBtn) {
        toggleBtn.addEventListener("click", function() {
            setModalVisibility(!isOpen);
        });
    }

    if (closeBtn) {
        closeBtn.addEventListener("click", function() {
            setModalVisibility(false);
        });
    }

    // Reload iframe conversation
    if (reloadBtn && chatIframe) {
        reloadBtn.addEventListener("click", function() {
            if (chatLoader) {
                chatLoader.style.opacity = "1";
                chatLoader.style.display = "flex";
            }
            const currentSrc = chatIframe.src;
            chatIframe.src = currentSrc;
        });
    }

    // Hide loader when iframe has loaded
    if (chatIframe) {
        chatIframe.addEventListener("load", function() {
            if (chatLoader) {
                chatLoader.style.opacity = "0";
                setTimeout(() => { chatLoader.style.display = "none"; }, 350);
            }
            syncChatbotTheme();
        });
    }

    // Auto-detect dark/light theme switch on document.documentElement
    const themeObserver = new MutationObserver(function(mutations) {
        for (const mutation of mutations) {
            if (mutation.attributeName === "class") {
                const currentTheme = getActivePortfolioTheme();
                syncChatbotTheme(currentTheme);
            }
        }
    });
    themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });

    // Initial theme synchronization on DOM load
    document.addEventListener("DOMContentLoaded", function() {
        syncChatbotTheme();
    });
})();
</script>
